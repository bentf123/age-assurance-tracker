<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Global Age Assurance Policy Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --navy:#002147; --blue:#00629B; --sky:#41B6E6;
  --page:#ffffff; --ink:#1b2433; --ink-2:#1b2433; --muted:#1b2433; --rule:#d5dbe3; --rule-soft:#e8ecf1;
  --sm:#e0632f; --ds:#13976a; --mc:#6250d6;
  --serif:"EB Garamond",Garamond,"Times New Roman",serif;
  --sans:"Inter",Arimo,Calibri,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
a{color:var(--blue);text-underline-offset:2px}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:1240px;margin:0 auto;padding:0 32px}
.swatch{display:inline-block;width:10px;height:10px;flex:none}
.label{font-size:13px;color:var(--muted)}

/* ---------- masthead ---------- */
.masthead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px 24px;padding-top:16px;padding-bottom:16px}
.logo{display:block;justify-self:end;height:54px;width:auto}
.publisher{justify-self:start;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left}
.publisher .org{font-family:var(--sans);font-size:15px;color:var(--navy)}
.publisher .org b{font-weight:600}
.publisher .draft{font-family:var(--serif);font-style:italic;font-size:16px;color:var(--blue)}
h1{font-family:var(--serif);font-weight:500;font-size:clamp(24px,2.5vw,34px);line-height:1.1;color:var(--navy);margin:0;text-align:center}
.meta{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 26px;font-size:13.5px;color:var(--muted);margin:0 0 16px}
.meta b{color:var(--ink);font-weight:600}

/* ---------- tab bar ---------- */
.tabbar{position:sticky;top:0;z-index:40;background:var(--page);border-bottom:1px solid var(--rule)}
.tabbar .wrap{display:flex;align-items:stretch;gap:0 36px}
.tablist{display:flex;gap:0 36px;overflow-x:auto;scrollbar-width:none}
.tab{position:relative;padding:17px 0 15px;font-size:13px;font-weight:600;letter-spacing:.09em;color:var(--muted);white-space:nowrap}
.tab:hover{color:var(--navy)}
.tab[aria-selected="true"]{color:var(--navy)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--navy)}
.tab .n{font-weight:500;color:var(--muted);margin-left:6px;letter-spacing:0}
.searchbox{position:relative;margin-left:auto;align-self:center;width:min(380px,40vw)}
.searchbox svg{position:absolute;left:0;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--navy)}
.search{width:100%;border:0;border-bottom:1.5px solid var(--navy);background:transparent;padding:7px 6px 7px 28px;
        font-family:var(--serif);font-size:19px;color:var(--navy);border-radius:0}
.search::placeholder{color:#8a94a3;font-style:italic}
.search:focus{outline:none;border-bottom-color:var(--blue)}
.suggest{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:45;background:var(--page);border:1px solid var(--rule);
         box-shadow:0 14px 34px rgba(0,33,71,.14);max-height:440px;overflow:auto;padding:6px 0;min-width:320px}
.suggest .grp{padding:8px 14px 3px;font-size:12px;color:var(--muted)}
.suggest .it{display:flex;gap:10px;align-items:baseline;width:100%;padding:7px 14px;font-size:14.5px}
.suggest .it .n{margin-left:auto;font-size:12.5px;color:var(--muted);white-space:nowrap}
.suggest .it small{display:block;font-size:12.5px;color:var(--muted)}
.suggest .it[aria-selected="true"],.suggest .it:hover{background:#eef6fb}
.suggest mark{background:none;color:var(--blue);font-weight:600}

/* ---------- filter sidebar ---------- */
.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:0 52px;align-items:start}
.content{min-width:0}
/* Data tab: the filter list floats, so the table widens into the left margin once past it */
.layout.flow{display:block}
.layout.flow::after{content:"";display:block;clear:both}
.layout.flow .side{float:left;width:220px;margin-right:52px}
.side{padding:24px 6px 48px 0}
.side-sum{font-size:14px;color:var(--ink-2);line-height:1.45;padding-bottom:14px;border-bottom:1px solid var(--navy)}
.side-sum b{color:var(--navy);font-weight:600}
.side-sum .active{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.side-sum .fitem{display:block;font-size:13.5px}
.side-sum .fitem .label{display:block;font-size:12px}
.side-sum .linkbtn{margin-top:10px;font-size:13.5px}
.fg{border-bottom:1px solid var(--rule-soft)}
.fg summary{list-style:none;display:flex;align-items:baseline;gap:8px;cursor:pointer;padding:12px 0 8px;
            font-family:var(--serif);font-size:20px;color:var(--navy)}
.fg summary::-webkit-details-marker{display:none}
.fg summary::after{content:"+";margin-left:auto;font-family:var(--sans);font-size:16px;color:var(--muted)}
.fg[open] summary::after{content:"−"}
.fg summary .sel{font-family:var(--sans);font-size:12px;color:var(--blue)}
.fg .opts{padding:0 0 10px}
.fg .opt{display:grid;grid-template-columns:16px minmax(0,1fr) auto 32px;gap:1px 7px;align-items:baseline;padding:4px 0 3px;font-size:13.5px;line-height:1.3}
.fg .opt:hover{background:none;color:var(--navy)}
.fg .opt input{position:relative;top:1px}
.fg .opt .ol{overflow-wrap:anywhere}
.fg .opt .swatch{position:relative;top:1px;margin-right:6px}
.fg .opt .n{margin:0;font-size:12.5px;color:var(--ink);text-align:right}
.fg .opt .pc{font-size:11.5px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.fg .opt .ob{grid-column:2 / -1;height:3px;background:var(--rule-soft)}
.fg .opt .ob i{display:block;height:100%;background:var(--blue)}
.fg .opt.zero .ob i{background:none}
.fg .opt.on{color:var(--navy);font-weight:600}
.fg summary .cov,.fg summary .sel{margin-left:auto;white-space:nowrap}
.fg summary .sel+*{margin:0}
.fg summary .cov{font-family:var(--sans);font-size:11.5px;color:var(--muted)}
.fg summary:has(.cov)::after,.fg summary:has(.sel)::after{margin-left:8px}
.fg .def{margin:0 0 8px;font-size:12.5px;line-height:1.4;font-style:italic;color:var(--ink-2)}
.cbhead{margin:26px 0 2px;padding-bottom:6px;border-bottom:1px solid var(--navy);font-family:var(--serif);font-size:22px;color:var(--navy)}
.cbcat{border-bottom:1px solid var(--rule-soft)}
.cbcat>summary{list-style:none;display:flex;align-items:baseline;gap:8px;cursor:pointer;padding:10px 0 8px;font-size:14px;font-weight:600;color:var(--navy)}
.cbcat>summary::-webkit-details-marker{display:none}
.cbcat>summary::after{content:"+";margin-left:auto;font-weight:400;color:var(--muted)}
.cbcat[open]>summary::after{content:"−"}
.cbcat>summary .cov{font-weight:400;font-size:11.5px;color:var(--muted)}
.cbcat .fg.cbv{border-bottom:0;border-top:1px solid var(--rule-soft);margin-left:10px}
.cbcat .fg.cbv summary{font-family:var(--sans);font-size:13.5px;padding:8px 0 6px}

/* ---------- filters ---------- */
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:10px 30px;padding:16px 0 4px}
.fgroup{display:flex;align-items:center;flex-wrap:wrap;gap:4px 16px}
.fgroup>.label{margin-right:2px}
.tog{display:inline-flex;align-items:center;gap:7px;font-size:14px;color:var(--ink-2);padding:3px 0;border-bottom:2px solid transparent}
.tog:hover{color:var(--navy)}
.tog[aria-pressed="true"],.tog.on{color:var(--navy);font-weight:600;border-bottom-color:var(--blue)}
.tog .n{font-size:12px;color:var(--muted);font-weight:400}
.dd{position:relative}
.caret::after{content:"";display:inline-block;width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;
              transform:rotate(45deg) translateY(-3px);margin-left:3px}
.pop{position:absolute;top:calc(100% + 8px);left:0;z-index:40;min-width:250px;max-height:360px;overflow:auto;background:var(--page);
     border:1px solid var(--rule);box-shadow:0 14px 34px rgba(0,33,71,.14);padding:6px 0}
.opt{display:flex;align-items:center;gap:10px;padding:6px 14px;font-size:14px;cursor:pointer}
.opt:hover{background:#eef6fb}
.opt input{accent-color:var(--blue);margin:0}
.opt .n{margin-left:auto;color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.opt.zero{opacity:.45}
.status-line{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 28px;padding:10px 0 0;font-size:14px;color:var(--ink-2);min-height:32px}
.status-line b{color:var(--navy);font-weight:600}
.fitem{display:inline-flex;align-items:baseline;gap:7px;color:var(--navy)}
.fitem .label{font-size:12.5px}
.linkbtn{color:var(--blue);font-size:14px;text-decoration:underline;text-underline-offset:3px}

/* ---------- world map tab ---------- */
.panel{padding-bottom:90px;padding-top:6px}
.viewswitch{position:absolute;left:0;top:50%;transform:translateY(-50%);z-index:4;display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.viewswitch .label{margin:0 0 6px 15px}
.viewswitch .tog{font-family:var(--serif);font-size:21px;padding:5px 0 5px 12px;border-bottom:0;border-left:3px solid transparent;background:rgba(255,255,255,.85)}
.viewswitch .tog[aria-pressed="true"]{border-left-color:var(--navy);border-bottom:0}
.stage{padding-top:8px}
.mapbox{position:relative;margin:0 auto}
#globe{display:block;width:100%;height:min(86vh,900px);min-height:420px;cursor:grab;touch-action:none}
#globe:active{cursor:grabbing}
#globe .ocean{fill:url(#oceanGrad);stroke:#b9c7d6;stroke-width:1}
#globe .halo{fill:none;stroke:#e7eef5;stroke-width:14}
#globe .grat{fill:none;stroke:rgba(0,33,71,.07);stroke-width:.6}
#globe .land{fill:#d3dbe4;stroke:#fff;stroke-width:.5}
#globe .land.hit{cursor:pointer}
#globe .land.hit:hover,#globe .land.focus{stroke:var(--navy);stroke-width:1.5}
#globe .states{display:none}
#globe.us .states{display:inline}
#globe .dot{stroke:#fff;stroke-width:1.5;cursor:pointer}
.zoom{position:absolute;right:0;bottom:10px;display:flex;flex-direction:column;gap:4px}
.zoom button{width:30px;height:30px;border:1px solid var(--rule);background:var(--page);font-size:16px;line-height:1;color:var(--navy);text-align:center}
.zoom button:hover{border-color:var(--navy)}
.pins{position:absolute;inset:0;z-index:3;pointer-events:none}
.pin{position:absolute;left:0;top:0;background:var(--page);border:1px solid var(--rule);box-shadow:0 6px 18px rgba(0,33,71,.14);
     padding:5px 11px 6px;text-align:left;white-space:nowrap;opacity:0;transition:opacity .2s}
.pin::after{content:"";position:absolute;left:50%;bottom:-5px;width:9px;height:9px;background:var(--page);
            border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);transform:translateX(-50%) rotate(45deg)}
.pin small{display:block;font-size:11.5px;color:var(--muted);line-height:1.2}
.pin b{display:block;font-family:var(--serif);font-weight:500;font-size:18px;color:var(--navy);line-height:1.15}
.pin:hover{border-color:var(--navy)}
.pin:hover b{color:var(--blue)}
.legend{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 22px;font-size:13px;color:var(--ink-2);margin-top:4px}
.legend .key{display:inline-flex;align-items:center;gap:7px}
.legend svg{width:14px;height:14px;display:block}
.aside-link{display:flex;justify-content:center;gap:4px 28px;flex-wrap:wrap;margin-top:8px;font-size:14px}
.maperr{padding:80px 0;text-align:center;color:var(--muted)}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--page);border:1px solid var(--rule);box-shadow:0 10px 28px rgba(0,33,71,.16);
     padding:9px 12px;font-size:13px;max-width:280px;opacity:0;transition:opacity .08s}
.tip.show{opacity:1}
.tip b{display:block;font-family:var(--serif);font-size:18px;font-weight:500;color:var(--navy);margin-bottom:2px}
.tip .row{display:flex;gap:8px;align-items:center;color:var(--ink-2);line-height:1.6}
.tip .row .n{margin-left:auto;color:var(--ink);font-variant-numeric:tabular-nums}
.tip .hint{color:var(--muted);font-size:12px;margin-top:4px}

.mscrim{position:fixed;inset:0;z-index:74;background:rgba(0,33,71,.34)}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:75;width:min(620px,calc(100vw - 32px));
       max-height:min(82vh,760px);overflow:auto;background:var(--page);border-top:4px solid var(--navy);
       box-shadow:0 28px 70px rgba(0,33,71,.3);padding:26px 32px 26px}
.modal .x{position:absolute;right:16px;top:12px;font-size:30px;color:var(--muted);line-height:1}
.modal .x:hover{color:var(--navy)}
.modal .kind{font-size:13px;color:var(--muted)}
.modal h4{font-family:var(--serif);font-weight:500;font-size:38px;line-height:1.05;color:var(--navy);margin:2px 40px 12px 0}
.modal .split{display:flex;height:6px;max-width:260px;margin:0 0 10px}
.modal .split i{display:block;height:100%}
.modal .sum{font-size:14px;color:var(--ink-2);margin:0 0 14px}
.modal ul{list-style:none;margin:0;padding:0;border-bottom:1px solid var(--rule-soft)}
.modal li button{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 18px;align-items:baseline;width:100%;padding:10px 0;border-top:1px solid var(--rule-soft)}
.modal li .t{font-family:var(--serif);font-size:19px;line-height:1.25;color:var(--navy)}
.modal li .s{font-size:13px;color:var(--muted);white-space:nowrap}
.modal li .c{grid-column:1/-1;display:flex;gap:7px;align-items:baseline;font-size:13px;color:var(--ink-2)}
.modal li .c .swatch{position:relative;top:1px}
.modal li button:hover .t{color:var(--blue);text-decoration:underline;text-underline-offset:3px}
.modal .more{display:inline-block;margin-top:16px;font-size:14.5px}

.figs-h{font-family:var(--serif);font-weight:500;font-size:32px;line-height:1.1;color:var(--navy);margin:34px 0 14px}
.figures{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin:0;border-top:1px solid var(--navy);padding-top:22px}
.fig{display:flex;flex-direction:column;padding:0 26px;border-left:1px solid var(--rule)}
.fig:first-child{padding-left:0;border-left:0}
.fig .k{display:flex;align-items:baseline;gap:8px;line-height:1.2;font-family:var(--serif);font-size:20px;color:var(--navy)}
.fig .v{font-size:64px;font-weight:500;line-height:1;color:var(--navy);margin:12px 0 10px;letter-spacing:-.02em;font-variant-numeric:lining-nums}
.fig .split{display:flex;height:6px;margin:0 0 10px;max-width:220px}
.fig .split i{display:block;height:100%}
.fig .s{font-size:14px;color:var(--muted);line-height:1.45}
.fig[data-fig]:not([data-fig="all"]):hover .k{text-decoration:underline;text-underline-offset:4px}
.fig[aria-pressed="true"] .v{color:var(--blue)}
.fig[aria-pressed="true"] .k{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}

.section{margin-top:70px;border-top:1px solid var(--navy);padding-top:16px}
.section h2{font-family:var(--serif);font-weight:500;font-size:42px;line-height:1.05;color:var(--navy);margin:0 0 6px}
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:46px 56px;margin-top:30px}
.chart{min-width:0}
.chart.wide{grid-column:span 2}
.chart h3{font-family:var(--serif);font-weight:500;font-size:25px;line-height:1.15;color:var(--navy);margin:0 0 3px}
.info{display:inline-grid;place-items:center;position:relative;top:-2px;width:17px;height:17px;margin-left:8px;border:1px solid var(--navy);border-radius:50%;
      font-family:var(--serif);font-style:italic;font-size:12px;line-height:1;color:var(--navy);vertical-align:middle;cursor:help}
.info:hover,.info:focus-visible{background:var(--navy);color:#fff}
.info::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 9px);transform:translateX(-50%);z-index:50;width:260px;
             padding:10px 12px;background:var(--page);border:1px solid var(--rule);box-shadow:0 10px 28px rgba(0,33,71,.16);
             font-family:var(--sans);font-style:normal;font-size:13px;font-weight:400;line-height:1.45;color:var(--ink);text-align:left;
             letter-spacing:0;white-space:normal;opacity:0;pointer-events:none;transition:opacity .12s}
.info:hover::after,.info:focus-visible::after{opacity:1}
.chart .dek{margin:0 0 14px;font-size:13.5px;color:var(--muted)}
.bars{display:grid;gap:2px}
.brow{display:grid;grid-template-columns:minmax(100px,40%) minmax(0,1fr);align-items:center;gap:12px;padding:3px 0;min-height:26px;width:100%}
.brow .lb{font-size:14px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .tr{display:flex;align-items:center;gap:8px;min-width:0}
.brow .fill{height:12px;border-radius:0 3px 3px 0;min-width:2px;background:var(--blue)}
.brow .val{font-size:13.5px;color:var(--ink);font-variant-numeric:tabular-nums}
.brow:hover .lb{color:var(--blue);text-decoration:underline;text-underline-offset:3px}
.brow[aria-pressed="true"] .lb{font-weight:600;color:var(--navy)}
.brow[aria-pressed="true"] .fill{background:var(--navy)}
.brow.zero{opacity:.45}
.donutwrap{display:flex;align-items:center;gap:22px 28px;flex-wrap:wrap}
.donutwrap svg{width:190px;height:190px;flex:none;overflow:visible}
.donutwrap svg [data-f],.donutwrap svg [data-cm]{cursor:pointer}
.donutwrap svg path{stroke:var(--page);stroke-width:2}
.donutwrap svg path:hover,.donutwrap svg path:focus-visible{opacity:.8;outline:none}
.donutwrap .ct{font-family:var(--serif);font-size:34px;fill:var(--navy)}
.donutwrap .cs{font-size:12px;fill:var(--muted)}
.lgd{display:grid;gap:3px;min-width:200px;flex:1}
.lrow{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:9px;align-items:baseline;width:100%;padding:3px 0;font-size:14px;color:var(--ink)}
.lrow .swatch{position:relative;top:1px}
.lrow .n{font-variant-numeric:tabular-nums}
.lrow .n small{color:var(--muted);margin-left:6px;font-size:12.5px}
.lrow:hover>span:nth-child(2){color:var(--blue);text-decoration:underline;text-underline-offset:3px}
.lrow.minor{padding-left:21px;font-size:13px;color:var(--ink-2)}
.lrow[aria-pressed="true"]>span:nth-child(2){font-weight:600;color:var(--navy)}
.waffle{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:3px;max-width:360px;margin-bottom:14px}
.waffle i{display:block;aspect-ratio:1;border-radius:1px}
.lolli{display:grid;gap:6px}
.lolli .lrow2{display:grid;grid-template-columns:minmax(110px,42%) minmax(0,1fr);gap:12px;align-items:center;width:100%;padding:3px 0}
.lolli .lb{font-size:14px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lolli .tr{position:relative;height:14px}
.lolli .ln{position:absolute;left:0;top:6px;height:2px;background:var(--blue)}
.lolli .dt{position:absolute;top:1px;width:12px;height:12px;border-radius:50%;background:var(--navy);transform:translateX(-50%)}
.lolli .vl{position:absolute;top:-2px;font-size:13.5px;color:var(--ink);font-variant-numeric:tabular-nums}
.lolli .lrow2:hover .lb{color:var(--blue);text-decoration:underline;text-underline-offset:3px}
.stackbar{display:flex;height:30px;width:100%;margin:4px 0 12px}
.stackbar button{height:100%;min-width:3px;border-right:2px solid var(--page);color:#fff;font-size:13px;font-weight:600;text-align:left;padding:0 10px;overflow:hidden;white-space:nowrap}
.stackbar button:last-child{border-right:0}
.stackbar button:hover{opacity:.85}
.stacklgd{display:flex;flex-wrap:wrap;gap:4px 28px}
.stacklgd .lrow{width:auto;grid-template-columns:12px auto auto}
.agechart{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:16px 40px;align-items:end}
.agecols{display:flex;align-items:flex-end;gap:10px;height:190px;border-bottom:1px solid var(--navy);padding:0 4px}
.agecol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.agecol .bar{width:100%;max-width:54px;background:var(--blue);border-radius:3px 3px 0 0;min-height:0}
.agecol .val{font-size:13.5px;margin-bottom:4px;font-variant-numeric:tabular-nums}
.agecol:hover .bar{background:var(--navy)}
.agecol[aria-pressed="true"] .bar{background:var(--navy)}
.agecol.zero .val{opacity:.45}
.ageaxis{display:flex;gap:10px;padding:6px 4px 0}
.ageaxis span{flex:1;text-align:center;font-family:var(--serif);font-size:18px;color:var(--navy)}
.agenote{font-size:14px;line-height:1.5}
.agenote b{font-family:var(--serif);font-weight:500;font-size:34px;color:var(--navy);display:block;line-height:1}
.catblock{margin-bottom:12px}
.catblock .cname{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--navy);margin-bottom:2px}
.heat{width:100%;border-collapse:separate;border-spacing:2px;font-size:13.5px}
.heat th{font-weight:400;color:var(--ink-2);text-align:left;padding:4px 8px 4px 0;font-size:13.5px;white-space:nowrap}
.heat thead th{text-align:center;font-weight:600;color:var(--navy);font-size:13px;padding-bottom:6px}
.heat thead th .swatch{margin-right:6px}
.heat td{text-align:center;padding:0;height:34px;font-variant-numeric:tabular-nums}
.heat td button{width:100%;height:100%;font-size:13.5px;text-align:center}
.heat td button:hover{outline:2px solid var(--navy);outline-offset:-2px}
.heat td.z{color:var(--muted);background:#f6f8fa}
.heat td.tot{color:var(--ink-2);font-weight:600}

/* ---------- countries tab ---------- */
.cindex{columns:4 200px;column-gap:36px;margin:30px 0 0;padding:0 0 26px;border-bottom:1px solid var(--navy)}
.cindex a{display:flex;gap:8px;align-items:baseline;break-inside:avoid;padding:3px 0;font-family:var(--serif);font-size:18px;color:var(--navy);text-decoration:none}
.cindex a:hover span:first-child{text-decoration:underline;text-underline-offset:3px;color:var(--blue)}
.cindex a .n{margin-left:auto;font-family:var(--sans);font-size:12.5px;color:var(--muted)}
.cindex .letter{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:16px;margin:10px 0 2px;break-after:avoid}
.cindex .letter:first-child{margin-top:0}
.centry{padding:30px 0 22px;border-bottom:1px solid var(--rule);scroll-margin-top:60px}
.centry>div:first-child{position:sticky;top:52px;z-index:2;background:var(--page);display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 18px;padding:8px 0 10px;margin-bottom:4px;border-bottom:1px solid var(--navy)}
.centry h3{font-family:var(--serif);font-weight:500;font-size:30px;line-height:1.1;color:var(--navy);margin:0}
.centry .cmeta{font-size:13.5px;color:var(--muted)}
.centry .cbar{display:flex;height:5px;width:120px;margin-left:auto;align-self:center}
.centry .cbar i{display:block;height:100%}
.sub{font-family:var(--serif);font-style:italic;font-size:18px;color:var(--ink-2);margin:14px 0 2px;scroll-margin-top:70px}
.sub:first-child{margin-top:0}
.irow{display:grid;grid-template-columns:minmax(0,1fr) 190px 120px 130px;gap:20px;align-items:baseline;width:100%;padding:11px 0;border-top:1px solid var(--rule-soft)}
.irow:first-child,.sub+.irow{border-top:0}
.irow .t{font-family:var(--serif);font-size:20px;line-height:1.3;color:var(--navy)}
.irow:hover .t{color:var(--blue);text-decoration:underline;text-underline-offset:3px}
.irow .c{font-size:13.5px;color:var(--ink-2);display:flex;gap:7px;align-items:baseline}
.irow .c .swatch{position:relative;top:1px}
.empty{padding:22px 0;color:var(--muted);font-size:15px}

/* ---------- explore tab ---------- */
.vars{padding-top:20px}
.vars-h{font-family:var(--serif);font-weight:500;font-size:36px;line-height:1.05;color:var(--navy);margin:0}
.varcats{display:flex;flex-wrap:wrap;gap:6px 26px;margin:16px 0 0;padding-bottom:10px;border-bottom:1px solid var(--navy)}
.vcat{font-family:var(--serif);font-size:20px;color:var(--ink-2);padding:2px 0;border-bottom:2px solid transparent}
.vcat:hover{color:var(--navy)}
.vcat[aria-selected="true"]{color:var(--navy);border-bottom-color:var(--blue)}
.vcat .n{font-family:var(--sans);font-size:12px;color:var(--muted);margin-left:5px}
.vcat .n b{color:var(--blue);font-weight:600}
.varhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 22px;margin:14px 0 6px}
.varhead .label{margin-right:auto}
.vgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 40px}
.vopt{display:grid;grid-template-columns:18px minmax(0,1fr);gap:4px 8px;align-items:baseline;padding:8px 0;border-top:1px solid var(--rule-soft);cursor:pointer}
.vopt input{accent-color:var(--blue);margin:0;position:relative;top:2px}
.vopt b{font-weight:600;font-size:14px;color:var(--navy)}
.vopt small{display:block;font-size:13px;color:var(--muted);line-height:1.4;margin-top:1px}
.vopt:hover b{color:var(--blue)}
.tabletools{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center;margin:28px 0 12px}
.tablewrap{overflow-x:auto;overflow-y:visible}
table.grid{border-collapse:collapse;width:100%;font-size:14px}
table.grid th{position:sticky;top:0;z-index:2;background:var(--page);text-align:left;font-weight:600;font-size:12.5px;
              color:var(--ink-2);padding:10px 14px 8px 0;border-bottom:1px solid var(--navy);white-space:nowrap}
table.grid th button{display:inline-flex;gap:4px;align-items:center;font-weight:600}
table.grid th[aria-sort]{color:var(--navy)}
table.grid td{padding:10px 14px 10px 0;border-bottom:1px solid var(--rule-soft);vertical-align:top;min-width:120px;max-width:340px}
table.grid tbody tr{cursor:pointer}
table.grid tbody tr:hover .nm{color:var(--blue);text-decoration:underline;text-underline-offset:3px}
table.grid td.name{min-width:280px}
table.grid .ctry{display:block;font-size:12.5px;color:var(--muted)}
table.grid .nm{font-family:var(--serif);font-size:19px;line-height:1.25;color:var(--navy)}
.tag{display:inline-flex;align-items:baseline;gap:7px}
.tag .swatch{position:relative;top:1px}
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.na{color:var(--muted);font-style:italic}
.note{font-size:13px;color:var(--muted);margin:12px 0 0}

/* ---------- profile drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,33,71,.34);z-index:78;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;left:50%;top:50%;z-index:80;width:min(860px,calc(100vw - 32px));height:min(88vh,920px);background:var(--page);
        border-top:4px solid var(--navy);box-shadow:0 30px 80px rgba(0,33,71,.32);display:flex;flex-direction:column;
        transform:translate(-50%,-48%) scale(.98);opacity:0;visibility:hidden;transition:transform .22s ease,opacity .22s ease,visibility .22s}
.drawer.show{transform:translate(-50%,-50%);opacity:1;visibility:visible}
.drawer-head{padding:26px 34px 18px;border-bottom:1px solid var(--navy);display:flex;gap:16px;align-items:flex-start}
.drawer-head .where{font-size:13.5px;color:var(--muted)}
.drawer-head h3{font-family:var(--serif);font-weight:500;font-size:34px;line-height:1.08;color:var(--navy);margin:4px 0 12px}
.close{margin-left:auto;flex:none;font-size:30px;line-height:1;color:var(--navy);padding:0 4px}
.facts{display:flex;flex-wrap:wrap;gap:6px 24px;font-size:13.5px;color:var(--ink-2)}
.facts b{font-weight:600;color:var(--ink)}
.drawer-body{overflow-y:auto;padding:4px 34px 50px;flex:1}
.cat-block{margin-top:24px;scroll-margin-top:12px}
.djump{display:flex;flex-wrap:wrap;gap:4px 18px;padding:14px 0 10px;border-bottom:1px solid var(--rule-soft);font-family:var(--serif);font-size:17px}
.djump a{color:var(--blue);text-decoration:none}
.djump a:hover{text-decoration:underline;text-underline-offset:3px}
.cat-block h4{margin:0 0 4px;font-family:var(--serif);font-weight:500;font-size:21px;color:var(--navy)}
.entry{display:grid;grid-template-columns:210px minmax(0,1fr);gap:16px;padding:8px 0;border-bottom:1px solid var(--rule-soft);font-size:14.5px}
.entry dt{color:var(--ink-2)}
.entry dd{margin:0;word-break:break-word}
.fn{font-size:10.5px;vertical-align:super;margin-left:2px;text-decoration:none}
.refs ol{padding-left:22px;margin:6px 0 0;font-size:13px;color:var(--ink-2)}
.refs li{margin-bottom:5px;word-break:break-all}
.refs li.lit{background:#e6f4fb}

@media (max-width:1060px){
  .layout{grid-template-columns:190px minmax(0,1fr);gap:0 32px}
  .layout.flow .side{width:190px;margin-right:32px}
  .figures{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:28px}
  .fig:nth-child(3){padding-left:0;border-left:0}
  .irow{grid-template-columns:minmax(0,1fr) 170px 110px}
  .irow .c:last-child{display:none}
}
@media (max-width:820px){
  .wrap{padding:0 16px}
  .tabbar .wrap{flex-wrap:wrap;gap:0 22px}
  .masthead{grid-template-columns:1fr auto;gap:10px 16px}
  .logo{height:42px}
  .masthead h1{grid-column:1 / -1;grid-row:2;text-align:left}
  .publisher{font-size:13px}
  .tablist{gap:0 22px;max-width:100%}
  .searchbox{order:5;width:100%;margin:0 0 10px}
  .layout{grid-template-columns:1fr}
  .layout.flow .side{float:none;width:auto;margin-right:0}
  .side{padding:16px 0 8px}
  .figures{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:28px}
  .fig:nth-child(3){padding-left:0;border-left:0}
  .fig .v{font-size:46px}
  .charts{grid-template-columns:1fr}
  .chart.wide{grid-column:auto}
  .agechart{grid-template-columns:1fr}
  .zoom{display:none}
  #globe{height:auto;min-height:0;aspect-ratio:1200/860}
  .viewswitch{position:static;transform:none;flex-direction:row;justify-content:center;gap:0 18px;margin:8px 0 0}
  .viewswitch .label{display:none}
  .viewswitch .tog{font-size:17px;padding:2px 0;border-left:0;border-bottom:2px solid transparent}
  .viewswitch .tog[aria-pressed="true"]{border-bottom-color:var(--blue)}
  .modal{padding:22px 18px}
  .modal h4{font-size:30px}
  .centry>div:first-child{position:static}
  .centry .cbar{margin-left:0;width:100%}
  .irow{grid-template-columns:1fr;gap:2px}
  .irow .c:nth-child(n+3){display:none}
  .entry{grid-template-columns:1fr;gap:2px}
  .vgrid{grid-template-columns:1fr}
  .drawer{width:100vw;height:100dvh;border-top-width:3px}
  .drawer-head,.drawer-body{padding-left:18px;padding-right:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

/* codebook facets: every categorical, boolean, numeric or percentage variable outside Overview */

  FILTERS.push({key:"v:" + v, label:v, cb:true, multi:true, get:function(g){ return splitVals(g.values[v]); },
    sorter:function(a, b){ var ra = a in VALUE_RANK ? VALUE_RANK[a] : 5, rb = b in VALUE_RANK ? VALUE_RANK[b] : 5;
      return ra - rb || a.localeCompare(b, undefined, {numeric:true}); }});
});

function valsOf(f, g){ var v = f.get(g); return f.multi ? v : (v ? [v] : []); }

  return Object.keys(seen).sort(f.sorter || function(a,b){ return f.order ? (idx(f.order,a) - idx(f.order,b) || a.localeCompare(b)) : a.localeCompare(b); });

    .sort(function(a,b){ return (a.label.toLowerCase().indexOf(q) - b.label.toLowerCase().indexOf(q)) || b.n - a.n; }).slice(0,6);
  var insts = R.filter(function(g){ return g.name.toLowerCase().indexOf(q) !== -1; }).slice(0,8);

function positionPins(){
  if(!pinEls.length) return;
  var box = svg.node().getBoundingClientRect(), hostBox = document.getElementById("mapbox").getBoundingClientRect();
  var sc = Math.min(box.width / W, box.height / H);
  var ox = box.left - hostBox.left + (box.width - W * sc) / 2, oy = box.top - hostBox.top + (box.height - H * sc) / 2;
  var centre = [-mapState.rotate[0], -mapState.rotate[1]], placed = [];
  pinEls.forEach(function(p){

    if(!p.el._w){ p.el._w = p.el.offsetWidth; p.el._h = p.el.offsetHeight; }

function drawLollipop(hostId, key, order){
  var vis = visible(), f = FBY[key], counts = countBy(vis, f.get);
  var max = Math.max.apply(null, order.map(function(v){ return counts[v] || 0; }).concat([1]));
  document.getElementById(hostId).innerHTML = order.map(function(v){
    var n = counts[v] || 0, w = n / max * 82;
    return '<button class="lrow2'+(n ? "" : " zero")+'" type="button" data-f="'+key+'" data-v="'+esc(v)+'" aria-pressed="'+(f.sel.indexOf(v) !== -1)+'" title="'+esc(v)+': '+n+'">'+
      '<span class="lb">'+esc(v)+'</span><span class="tr"><span class="ln" style="width:'+w+'%"></span>'+
      (n ? '<span class="dt" style="left:'+w+'%"></span>' : '')+'<span class="vl" style="left:calc('+w+'% + 12px)">'+n+'</span></span></button>';
  }).join("");
}
function drawStack(hostId, key, order, colors){
  var vis = visible(), f = FBY[key], counts = countBy(vis, f.get), total = vis.length;
  document.getElementById(hostId).innerHTML = '<div class="stackbar">'+order.filter(function(v){ return counts[v]; }).map(function(v){
      var n = counts[v], w = n / total * 100;
      return '<button type="button" data-f="'+key+'" data-v="'+esc(v)+'" style="width:'+w+'%;background:'+colors[v]+'" title="'+esc(v)+': '+n+'">'+(w > 9 ? pct(n, total) : '')+'</button>';
    }).join("")+'</div><div class="lgd stacklgd">'+order.filter(function(v){ return counts[v]; }).map(function(v){
      return lrow('data-f="'+key+'" data-v="'+esc(v)+'"', colors[v], v, counts[v], total, false, f.sel.indexOf(v) !== -1);
    }).join("")+'</div>';
}
function bars(hostId, key, order){
  var f = FBY[key], counts = countBy(visible(), f.get), cats = order || values(f);
  var max = Math.max.apply(null, cats.map(function(c){ return counts[c] || 0; }).concat([1]));
  document.getElementById(hostId).innerHTML = cats.map(function(c){
    var n = counts[c] || 0, on = f.sel.indexOf(c) !== -1;
    return '<button class="brow'+(n?"":" zero")+'" type="button" data-f="'+key+'" data-v="'+esc(c)+'" aria-pressed="'+on+'" title="'+esc(c)+': '+n+'">'+
      '<span class="lb">'+esc(c)+'</span><span class="tr"><span class="fill" style="width:'+(n/max*86)+'%"></span><span class="val">'+n+'</span></span></button>';
  }).join("");
}
/* columns on an age axis; uncoded instruments are counted, not plotted */
function drawAges(){
  var vis = visible(), key = "v:Primary age threshold", f = FBY[key], counts = {}, uncoded = 0;
  vis.forEach(function(g){
    var x = g.values["Primary age threshold"];
    if(x == null || isNaN(parseInt(x, 10))) { uncoded++; return; }
    counts[x] = (counts[x] || 0) + 1;
  });
  var ages = [13,14,15,16,17,18].map(String);
  Object.keys(counts).forEach(function(a){ if(ages.indexOf(a) === -1) ages.push(a); });
  ages.sort(function(a, b){ return a - b; });
  var max = Math.max.apply(null, ages.map(function(a){ return counts[a] || 0; }).concat([1]));
  var coded = vis.length - uncoded;
  document.getElementById("chAge").innerHTML = '<div class="agechart"><div><div class="agecols">'+ages.map(function(a){
      var n = counts[a] || 0, on = f.sel.indexOf(a) !== -1;
      return '<button class="agecol'+(n ? "" : " zero")+'" type="button" data-f="'+key+'" data-v="'+a+'" aria-pressed="'+on+'" title="Under '+a+': '+plural(n, "instrument")+'">'+
        '<span class="val">'+n+'</span><span class="bar" style="height:'+(n / max * 82)+'%"></span></button>';
    }).join("")+'</div><div class="ageaxis">'+ages.map(function(a){ return '<span>'+a+'</span>'; }).join("")+'</div></div>'+
    '<div class="agenote"><b>'+coded+'</b>of '+plural(vis.length, "instrument")+' coded for age threshold.<br>'+uncoded+' not yet coded.</div></div>';
}
function drawTrends(){
  var vis = visible(), parts = scopeItems();
  document.getElementById("trendScope").innerHTML = parts.length
    ? '<span>Showing <b>'+vis.length+'</b> of '+R.length+' instruments</span>'+parts.join("")+'<button class="linkbtn" type="button" data-clear>Show all instruments</button>'
    : '<span>All <b>'+R.length+'</b> instruments</span>';
  drawSunburst(vis);
  drawAges();
  var hmax = 1, m = {};
  STATUS_ORDER.forEach(function(s){ CATS.forEach(function(c){
    var n = vis.filter(function(g){ return g.values.Status === s && g.cat === c.key; }).length; m[s+c.key] = n; hmax = Math.max(hmax, n); }); });
  document.getElementById("chHeat").innerHTML = '<table class="heat"><thead><tr><th></th>'+CATS.map(function(c){ return '<th scope="col">'+sw(c.hex)+esc(c.key)+'</th>'; }).join("")+
    '<th scope="col">All</th></tr></thead><tbody>'+STATUS_ORDER.map(function(s){
      var tot = 0;
      var tds = CATS.map(function(c){
        var n = m[s+c.key]; tot += n;
        if(!n) return '<td class="z">0</td>';
        var step = Math.min(RAMP.length-1, Math.floor(n/hmax*(RAMP.length-0.01)));
        var on = FBY.status.sel.indexOf(s) !== -1 && FBY.cat.sel.indexOf(c.key) !== -1;
        return '<td style="background:'+RAMP[step]+'"><button type="button" data-heat="'+esc(s)+'|'+esc(c.key)+'" aria-pressed="'+on+'" title="'+esc(s)+', '+esc(c.key)+': '+n+'" style="color:'+(step===0?"#002147":"#fff")+';font-weight:'+(on?700:400)+'">'+n+'</button></td>';
      }).join("");
      return '<tr><th scope="row">'+esc(s)+'</th>'+tds+'<td class="tot">'+tot+'</td></tr>';
    }).join("")+'</tbody></table>';
  drawPie("chLevel", "level", ["Supranational","National","Sub-national"], LEVEL_COL);
  bars("chStatus","status",STATUS_ORDER); bars("chRegion","region");
  drawWaffle();
  drawLollipop("chOrig","orig",ORIG_ORDER);
  drawStack("chDepth","depth",DEPTH_ORDER, DEPTH_COL);
}
document.getElementById("panel-map").addEventListener("keydown", function(e){
  if((e.key === "Enter" || e.key === " ") && e.target.closest && e.target.closest(".donutwrap path[role=button]")){
    e.preventDefault(); e.target.dispatchEvent(new MouseEvent("click", {bubbles:true}));
  }
});
document.getElementById("panel-map").addEventListener("click", function(e){
  var b = e.target.closest(".charts [data-f]");
  if(b){ toggle(b.getAttribute("data-f"), b.getAttribute("data-v")); update(); return; }
  var cm = e.target.closest("[data-cm]");
  if(cm){ var p = cm.getAttribute("data-cm").split("|"), on = cm.getAttribute("aria-pressed") === "true";
    FBY.cat.sel = on ? [] : [p[0]]; FBY.mode.sel = on ? [] : [p[1]]; update(); return; }
  var h = e.target.closest("[data-heat]");
  if(h){ var q = h.getAttribute("data-heat").split("|"), on2 = h.getAttribute("aria-pressed") === "true";
    FBY.status.sel = on2 ? [] : [q[0]]; FBY.cat.sel = on2 ? [] : [q[1]]; update(); }
});

/* ---------- countries ---------- */
function drawCountries(){
  var vis = visible(), by = {};
  vis.forEach(function(g){ (by[g.base] = by[g.base] || []).push(g); });
  var names = Object.keys(by).sort(function(a,b){ return a.localeCompare(b); });
  var total = Object.keys(countBy(R, function(g){ return g.base; })).length;
  if(!names.length){
    document.getElementById("cindex").innerHTML = "";
    document.getElementById("clist").innerHTML = '<p class="empty">No jurisdiction has an instrument matching these filters.</p>';
    return;
  }
  var letter = null, idxHtml = "";
  names.forEach(function(n){
    var L = n.charAt(0).toUpperCase();
    if(L !== letter){ letter = L; idxHtml += '<div class="letter">'+L+'</div>'; }
    idxHtml += '<a href="#" data-goto="'+by[n][0].anchor+'"><span>'+esc(n)+'</span><span class="n">'+by[n].length+'</span></a>';
  });
  document.getElementById("cindex").innerHTML = idxHtml;
  var row = function(g){
    return '<button class="irow" type="button" data-open="'+g.id+'"><span class="t">'+esc(g.name)+'</span>'+
      '<span class="c">'+sw(catColor(g))+esc(g.values["Primary Type"] || "Type not yet coded")+'</span>'+
      '<span class="c">'+esc(g.values.Status || "")+'</span><span class="c">'+esc(g.values.Originator || "")+'</span></button>';
  };
  var order = function(a,b){ return idx(STATUS_ORDER, b.values.Status) - idx(STATUS_ORDER, a.values.Status) || a.name.localeCompare(b.name); };
  document.getElementById("clist").innerHTML = names.map(function(n){
    var list = by[n], subs = {}, national = [];
    list.forEach(function(g){ if(g.subnational) (subs[g.subnational] = subs[g.subnational] || []).push(g); else national.push(g); });
    var subNames = Object.keys(subs).sort();
    var body = "";
    if(subNames.length){
      if(national.length) body += '<div class="sub">'+(n === "United States" ? "Federal" : "National")+'</div>' + national.sort(order).map(row).join("");
      subNames.forEach(function(s){ body += '<div class="sub" id="'+subs[s][0].subAnchor+'">'+esc(s)+'</div>' + subs[s].sort(order).map(row).join(""); });
    } else body = list.sort(order).map(row).join("");
    var meta = plural(list.length, "instrument") + (subNames.length ? ", across " + (national.length ? "federal level and " : "") + plural(subNames.length, n === "United States" ? "state" : "state") : "");
    return '<article class="centry" id="'+list[0].anchor+'"><div><h3>'+esc(n)+'</h3><div class="cmeta">'+esc(meta)+'</div>'+catSplit(list, "cbar")+'</div><div>'+body+'</div></article>';
  }).join("");
}

/* ---------- explore table ---------- */
var cols = DEFAULT_COLS.slice(), sort = {v:null, dir:1};
var VCATS = []; C.forEach(function(c){ if(VCATS.indexOf(c) === -1) VCATS.push(c); });
var openCat = VCATS[0];
function catVars(c){ return V.filter(function(v){ return catOfVar[v] === c && v !== "Name"; }); }
function drawColPicker(){
  document.getElementById("varcats").innerHTML = VCATS.map(function(c){
    var vs = catVars(c), on = vs.filter(function(v){ return cols.indexOf(v) !== -1; }).length;
    return '<button class="vcat" type="button" role="tab" data-vcat="'+esc(c)+'" aria-selected="'+(c === openCat)+'">'+esc(c)+
      '<span class="n">'+(on ? '<b>'+on+'</b> of ' : '')+vs.length+'</span></button>';
  }).join("");
  var vs = catVars(openCat), allOn = vs.every(function(v){ return cols.indexOf(v) !== -1; });
  document.getElementById("varlist").innerHTML = '<div class="varhead"><span class="label">'+esc(openCat)+': '+plural(vs.length, "variable")+'</span>'+
    '<button class="linkbtn" type="button" data-vall="'+(allOn ? "0" : "1")+'">'+(allOn ? "Remove all from table" : "Add all to table")+'</button></div>'+
    '<div class="vgrid">'+vs.map(function(v){
      var d = DEF[v] ? DEF[v].definition : "";
      return '<label class="vopt"><input type="checkbox" data-col="'+esc(v)+'"'+(cols.indexOf(v) !== -1 ? " checked" : "")+'>'+
        '<span><b>'+esc(v)+'</b>'+(d ? '<small>'+esc(d)+'</small>' : '')+'</span></label>';
    }).join("")+'</div>';
  document.getElementById("colCount").textContent = plural(cols.length + 1, "column") + " in the table";
}
function setCols(next){
  cols = next.filter(function(v, i){ return next.indexOf(v) === i; });
  cols.sort(function(a,b){ return V.indexOf(a) - V.indexOf(b); });
  drawColPicker(); drawTable();
}
function cellText(g, v){ var x = g.values[v]; return x == null ? "" : x; }
function drawTable(){
  var vis = visible();
  if(sort.v){
    vis.sort(function(a,b){
      var x = sort.v === "Name" ? a.country + a.name : cellText(a, sort.v), y = sort.v === "Name" ? b.country + b.name : cellText(b, sort.v);
      if(!x && y) return 1; if(x && !y) return -1;
      if(sort.v === "Status") return (idx(STATUS_ORDER, x) - idx(STATUS_ORDER, y)) * sort.dir;
      return x.localeCompare(y, undefined, {numeric:true}) * sort.dir;
    });
  }
  var t = document.getElementById("grid");
  var th = function(v, label){
    var s = sort.v === v ? (sort.dir === 1 ? "ascending" : "descending") : null;
    return '<th scope="col"'+(s ? ' aria-sort="'+s+'"' : "")+' title="'+esc(DEF[v] ? DEF[v].definition : "")+'"><button type="button" data-sort="'+esc(v)+'">'+
      esc(label)+'<span aria-hidden="true">'+(s ? (sort.dir === 1 ? "↑" : "↓") : "")+'</span></button></th>';
  };
  t.tHead.innerHTML = '<tr>'+th("Name","Instrument")+cols.map(function(v){ return th(v, v); }).join("")+'</tr>';
  if(!vis.length){ t.tBodies[0].innerHTML = '<tr><td colspan="'+(cols.length+1)+'" class="empty">No instruments match these filters.</td></tr>'; return; }
  t.tBodies[0].innerHTML = vis.map(function(g){
    return '<tr data-open="'+g.id+'" tabindex="0"><td class="name"><span class="ctry">'+esc(g.country)+'</span><span class="nm">'+esc(g.name)+'</span></td>'+
      cols.map(function(v){
        var x = g.values[v];
        if(v === "Primary Type" && x) return '<td><span class="tag">'+sw(catColor(g))+esc(x)+'</span></td>';
        return '<td><div class="clamp">'+(x == null ? '<span class="na">Not yet coded</span>' : esc(x))+'</div></td>';
      }).join("")+'</tr>';
  }).join("");
}
document.getElementById("grid").addEventListener("click", function(e){
  var s = e.target.closest("[data-sort]");
  if(s){ var v = s.getAttribute("data-sort"); sort = {v:v, dir: sort.v === v ? -sort.dir : 1}; drawTable(); }
});
document.getElementById("grid").addEventListener("keydown", function(e){
  var tr = e.target.closest("tr[data-open]");
  if(tr && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); openDrawer(tr.getAttribute("data-open")); }
});
document.getElementById("varcats").addEventListener("click", function(e){
  var b = e.target.closest("[data-vcat]"); if(!b) return;
  openCat = b.getAttribute("data-vcat"); drawColPicker();
});
document.getElementById("varlist").addEventListener("click", function(e){
  var b = e.target.closest("[data-vall]"); if(!b) return;
  var vs = catVars(openCat);
  setCols(b.getAttribute("data-vall") === "1" ? cols.concat(vs) : cols.filter(function(c){ return vs.indexOf(c) === -1; }));
});
document.getElementById("varlist").addEventListener("change", function(e){
  var v = e.target.getAttribute("data-col"); if(!v) return;
  setCols(e.target.checked ? cols.concat([v]) : cols.filter(function(c){ return c !== v; }));
});
document.getElementById("resetCols").addEventListener("click", function(){ setCols(DEFAULT_COLS.slice()); });
function download(name, type, text){
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], {type:type})); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 0);
}
document.getElementById("dlCsv").addEventListener("click", function(){
  var q = function(s){ s = s == null ? "" : String(s); return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; };
  var lines = [V.map(q).join(",")].concat(visible().map(function(g){ return V.map(function(v){ return q(g.values[v]); }).join(","); }));
  download("age-assurance-tracker-filtered.csv", "text/csv", "﻿" + lines.join("\n"));
});
document.getElementById("dlJson").addEventListener("click", function(){
  var drop = ["hay","refOrder","refIndex","cat","mode","level","depth","guid","anchor","subAnchor"];
  var clean = JSON.parse(JSON.stringify(D, function(k, v){ return drop.indexOf(k) !== -1 ? undefined : v; }));
  download("age-assurance-tracker.json", "application/json", JSON.stringify(clean, null, 1));
});

/* ---------- profile drawer ---------- */
var drawerOpen = false, lastFocus = null, showUncoded = true, current = null;
function urlOnly(s){ var m = String(s).match(/https?:\/\/[^\s;,]+/); return m ? m[0] : s; }
function openDrawer(id){
  var g = R.filter(function(x){ return x.id === id; })[0]; if(!g) return;
  current = g; lastFocus = document.activeElement;
  document.getElementById("dCtry").textContent = g.country;
  document.getElementById("dTitle").textContent = g.name;
  document.getElementById("dFacts").innerHTML = ["Primary Type","Status","Originator","First Date of Effect","Primary age threshold"].map(function(v){
    var t = g.values[v]; if(t == null || t === "N/A") return "";
    return '<span class="tag">'+(v === "Primary Type" ? sw(catColor(g)) : "")+esc(v === "Primary age threshold" ? "Age" : v)+' <b>'+esc(v === "First Date of Effect" ? fmtDate(t) : t)+'</b></span>';
  }).join("") + (g.values.Link ? '<a href="'+esc(urlOnly(g.values.Link))+'" target="_blank" rel="noopener">Read the instrument ↗</a>' : "");
  drawDrawerBody();
  document.getElementById("drawer").classList.add("show");
  document.getElementById("drawer").setAttribute("aria-hidden","false");
  document.getElementById("scrim").classList.add("show");
  drawerOpen = true;
  document.getElementById("dClose").focus();
}
function drawDrawerBody(){
  var g = current, blocks = "", seen = null, open = false, blank = 0;
  V.forEach(function(v){
    if(v === "Name" || v === "Country") return;
    if(g.values[v] == null){ blank++; if(!showUncoded) return; }
    if(catOfVar[v] !== seen){
      if(open) blocks += '</dl></section>';
      seen = catOfVar[v]; blocks += '<section class="cat-block" id="dcat-'+slug(seen)+'"><h4>'+esc(seen)+'</h4><dl>'; open = true;
    }
    blocks += '<div class="entry"><dt title="'+esc(DEF[v] ? DEF[v].definition : "")+'">'+esc(v)+'</dt><dd>'+renderValue(g, v)+'</dd></div>';
  });
  if(open) blocks += '</dl></section>';
  var tog = blank ? '<p style="margin:10px 0 0"><button class="linkbtn" type="button" id="togUncoded">'+(showUncoded ? "Hide" : "Show")+' the '+blank+' variables not yet coded</button></p>' : "";
  var refs = g.refOrder.map(function(u, i){
    var host = u.replace(/^https?:\/\//,"").split("/")[0].replace(/^www\./,"");
    return '<li id="ref-'+(i+1)+'"><a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(host)+'</a>: '+esc(u)+'</li>';
  }).join("");
  var shownCats = VCATS.filter(function(c){ return blocks.indexOf('id="dcat-'+slug(c)+'"') !== -1; });
  var jump = '<nav class="djump" aria-label="Jump to category">'+shownCats.map(function(c){ return '<a href="#dcat-'+slug(c)+'" data-dcat="dcat-'+slug(c)+'">'+esc(c)+'</a>'; }).join("")+'</nav>';
  document.getElementById("dBody").innerHTML = jump + tog + blocks +
    '<section class="refs cat-block"><h4>Sources cited above</h4>'+(refs ? '<ol>'+refs+'</ol>' : '<p class="empty">No source recorded.</p>')+'</section>';
}
function closeDrawer(){
  document.getElementById("drawer").classList.remove("show");
  document.getElementById("drawer").setAttribute("aria-hidden","true");
  document.getElementById("scrim").classList.remove("show");
  drawerOpen = false;
  if(lastFocus && lastFocus.focus) lastFocus.focus();
}
document.getElementById("dClose").addEventListener("click", closeDrawer);
document.getElementById("scrim").addEventListener("click", closeDrawer);
document.getElementById("dBody").addEventListener("click", function(e){
  if(e.target.id === "togUncoded"){ showUncoded = !showUncoded; drawDrawerBody(); return; }
  var dj = e.target.closest("[data-dcat]");
  if(dj){ e.preventDefault(); var sec = document.getElementById(dj.getAttribute("data-dcat")); if(sec) sec.scrollIntoView({behavior:"smooth", block:"start"}); return; }
  var fn = e.target.closest(".fn");
  if(fn){
    e.preventDefault();
    var li = document.getElementById("ref-" + fn.getAttribute("data-ref"));
    if(li){ li.scrollIntoView({behavior:"smooth", block:"center"}); li.classList.remove("lit"); void li.offsetWidth; li.classList.add("lit"); }
  }
});
document.addEventListener("click", function(e){
  var o = e.target.closest("[data-open]");
  if(o && !e.target.closest("a")) openDrawer(o.getAttribute("data-open"));
});

function update(){ drawFilterBar(); drawFigures(); paintMap(); drawTrends(); drawCountries(); drawTable(); if(!callout.hidden) hideCallout(); }
document.getElementById("stamp").textContent = D.meta.status;
drawColPicker(); update(); fitGlobe();

if(["map","countries","explore"].indexOf(startTab) !== -1) showTab(startTab, true);
